<!DOCTYPE html>
<html lang=3D"en">

<head>

    <title>Weather App</title>

    <style>

</head>

<body>

        <button onclick=3D"getLocationWeather()">Use Current Location</butt=
on>

    <script>
        const API_KEY =3D "YOUR_API_KEY_HERE"; // =E2=86=90 Replace with yo=
ur

        // Fetch weather by city
        function getWeather() {
            const city =3D document.getElementById("cityInput").value;

                return;

&appid=3D${API_KEY}&units=3Dmetric`)

        // Fetch weather using user's location
